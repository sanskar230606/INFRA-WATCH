server {
    listen 80;
    server_name localhost;

    # Root directory containing built static frontend files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA routing: fallback to index.html for client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api/ requests to the backend service container
    # The trailing slash on proxy_pass strips the /api prefix:
    #   /api/projects/filters  →  http://backend:5050/projects/filters
    # This matches the backend route: app.use("/projects", projectRoutes)
    location /api/ {
        proxy_pass http://infrawatch-backend:5050/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
